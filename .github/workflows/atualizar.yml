let bancoProdutos = {};

        async function carregarProdutosDoRadar() {
            try {
                // Tenta puxar o arquivo gerado pelo robô no GitHub
                const resposta = await fetch('produtos.json?t=' + Date.now());
                if (!resposta.ok) throw new Error("Offline ou carregando local");
                bancoProdutos = await resposta.json();
            } catch (erro) {
                console.log("Carregando base curada integrada...");
                // Se o arquivo ainda não foi gerado, usa a base integrada sem quebrar o site
            }
            filtrarCategoria(categoriaAtiva);
        }

        document.addEventListener('DOMContentLoaded', () => {
            carregarProdutosDoRadar();
            checarDadosCliente();
            inicializarCodecs();
            atualizarPreviaNomeEditor();
        });
