name: Atualizador Automatico TikTok Shop

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar Coletor
        run: python coletor_tiktok.py

      - name: Salvar e Publicar produtos.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add produtos.json
          git commit -m "Auto-Update: Produtos TikTok Shop [skip ci]" || exit 0
          git push
