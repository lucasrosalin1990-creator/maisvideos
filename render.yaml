services:
  - type: web
    name: maisvideos-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CAKTO_WEBHOOK_SECRET
        sync: false
      - key: CAKTO_MENSAL_OFFER_ID
        sync: false
      - key: CAKTO_ANUAL_OFFER_ID
        sync: false
