services:
  - type: web
    name: maisvideos-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CAKTO_WEBHOOK_SECRET
        sync: false
      - key: CAKTO_MENSAL_OFFER_ID
        sync: false
      - key: CAKTO_ANUAL_OFFER_ID
        sync: false
      - key: MAX_UPLOAD_MB
        value: "100"
      - key: MAX_TOTAL_UPLOAD_MB
        value: "250"
      - key: MAX_COMBINACOES
        value: "150"
      - key: TEMP_DIR
        value: "/tmp/maisvideos"
      - key: TEMP_RETENTION_SECONDS
        value: "10800"
